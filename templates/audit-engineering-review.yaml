id: audit-engineering-review
name: Audit — Engineering Review
description: |
  One reviewer audits the working tree for engineering hygiene — dead
  code, untested critical paths, weak types, naming drift, hardcoded
  config. Produces a checklist; you trim it; three workers fan out on
  per-task branches.
author: chorus
agreementThreshold: 0.66
onThresholdMet: ask
maxRounds: 1
yoloDefault: false
estimatedBaselineTokens: 600

phases:
  - id: audit
    kind: audit
    title: Engineering Review Audit
    preset: engineering-review
    description: Find dead code, untested critical paths, weak types, naming drift, hardcoded config.
    reviewer:
      lineage: anthropic
      models:
        - claude-opus-4-7
    inputs:
      include: []
      exclude: []

  - id: orchestrate
    kind: orchestrate
    title: Hygiene Workers
    description: Three workers each take a slice of the approved checklist and land cleanups on isolated branches.
    workers:
      - lineage: anthropic
        models:
          - claude-opus-4-7
      - lineage: openai
        models:
          - gpt-5.5
      - lineage: google
        models:
          - gemini-3.1-pro-preview
    branchPrefix: "chorus/{chatId}/worker-{idx}"
    maxConcurrentWorkers: 3
    inputs:
      include: []
      exclude: []
