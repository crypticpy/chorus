id: audit-de-slopify
name: Audit — De-Slopify
description: |
  One reviewer audits the working tree for AI-generated code smell —
  excessive comments, defensive guards, premature abstractions, dead
  code paths. Produces a checklist; you trim it; three workers fan out
  on per-task branches.
author: chorus
agreementThreshold: 0.66
onThresholdMet: ask
maxRounds: 1
yoloDefault: false
estimatedBaselineTokens: 600

phases:
  - id: audit
    kind: audit
    title: De-Slopify Audit
    preset: de-slopify
    description: Hunt for AI-generated code smell — verbose comments, defensive boilerplate, single-use abstractions.
    reviewer:
      lineage: anthropic
      models:
        - claude-opus-4-7
    inputs:
      include: []
      exclude: []

  - id: orchestrate
    kind: orchestrate
    title: Cleanup Workers
    description: Three workers each take a slice of the approved checklist and apply edits on isolated branches.
    workers:
      - lineage: anthropic
        models:
          - claude-opus-4-7
      - lineage: openai
        models:
          - gpt-5.5
      - lineage: google
        models:
          - gemini-3.1-pro-preview
    branchPrefix: "chorus/{chatId}/worker-{idx}"
    maxConcurrentWorkers: 3
    inputs:
      include: []
      exclude: []
